<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>RAs FP</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="page">

        <header class="hero">
            <h1>Mòduls i Resultats d'Aprenentatge</h1>
            <p>Consulta del currículum oficial de Formació Professional</p>
        </header>

        <div class="toolbar">
            <span id="cycleBadge" class="cycle-badge">DAM</span>
            <label for="cycleSelect">Cicle</label>

            <select id="cycleSelect">
                <option value="dam">DAM</option>
                <option value="smx">SMX</option>
            </select>
        </div>
        <div id="dashboard"></div>
        <div id="app"></div>

    </div>
    <div id="weightsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="weightsModalTitle"></h3>
                <button id="closeWeightsModal">✕</button>
            </div>

            <div id="weightsModalBody"></div>
        </div>
    </div>
    <script src="js/web.js"></script>
</body>

</html>
